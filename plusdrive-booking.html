<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DriveBookee – Booking</title>
<style>

:root{
  --bg:#0F2E24;
  --surface:#153A2D;
  --surface-2:#1C4636;
  --ink:#F5F2EA;
  --muted:#9FBBAC;
  --blue:#E8833A;
  --blue-deep:#CC7736;
  --green:#5FB85F;
  --green-deep:#4A9E4A;
  --gold:#E8833A;
  --gold-deep:#CC7736;
  --teal:#E8833A;
  --amber:#E8833A;
  --danger:#E37368;
  --line:rgba(245,242,234,0.16);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);font-family:Arial,sans-serif;min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
.wrap{max-width:780px;margin:0 auto;padding:28px 18px 80px;}

header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;flex-wrap:wrap;gap:8px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--blue-deep);display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;font-weight:700;color:#fff;font-size:16px;box-shadow:0 3px 10px rgba(38,44,130,0.2);transition:transform .2s ease;}
.brand-mark:hover{transform:scale(1.05);}
.brand h1{font-family:Arial,sans-serif;font-size:19px;margin:0;letter-spacing:-0.01em;color:var(--blue-deep);}
.brand span{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.02em;}
.mode-toggle{background:var(--surface);border:1.5px solid var(--line);color:var(--muted);font-size:12px;padding:7px 12px;border-radius:20px;cursor:pointer;font-family:Arial,sans-serif;}
.mode-toggle:hover{border-color:var(--blue);color:var(--blue);}

.roadline{height:6px;margin:22px 0 26px;border-radius:6px;background:linear-gradient(90deg, var(--blue) 0%, var(--teal) 50%, var(--green) 100%);opacity:.85;}

.step{display:none;}
.step.active{display:block;animation:fadein .35s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.step-label{font-size:12px;color:var(--green-deep);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px;}
h2{font-family:Arial,sans-serif;font-size:24px;margin:0 0 20px;color:var(--blue-deep);letter-spacing:-0.01em;}

.cat-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.cat-tab{background:var(--surface);border:1.5px solid var(--blue-deep);color:var(--blue-deep);font-size:13px;padding:8px 16px;border-radius:20px;cursor:pointer;font-family:Arial,sans-serif;font-weight:600;}
.cat-tab.active{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600;box-shadow:0 3px 10px rgba(217,113,31,0.3);}

.qty-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(11,37,69,0.05);}
.qty-label{font-size:13.5px;font-weight:500;}
.qty-stepper{display:flex;align-items:center;gap:14px;}
.qty-stepper button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface-2);color:var(--blue-deep);font-size:18px;cursor:pointer;font-family:Arial,sans-serif;line-height:1;touch-action:manipulation;}
.qty-stepper button:hover{border-color:var(--blue);color:var(--blue);}
.qty-num{font-family:Arial,sans-serif;font-weight:600;font-size:16px;min-width:16px;text-align:center;}

.packages{display:grid;gap:12px;}
.pkg{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px 20px;cursor:pointer;transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;position:relative;box-shadow:0 1px 3px rgba(11,37,69,0.05);}
.pkg:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(11,37,69,0.10);border-color:var(--blue);}
.pkg.selected{border-color:var(--blue);background:var(--surface-2);box-shadow:0 4px 14px rgba(92,100,214,0.14);}
.pkg-top{display:flex;justify-content:space-between;align-items:baseline;}
.pkg-name{font-family:Arial,sans-serif;font-size:17px;font-weight:600;}
.pkg-price{font-family:Arial,sans-serif;font-size:20px;font-weight:600;color:var(--green-deep);}
.pkg-desc{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5;}

.pkg-rich{padding:0;overflow:hidden;}
.pkg-rich:hover{border-color:var(--line);box-shadow:0 6px 18px rgba(11,37,69,0.1);}
.pkg-rich.selected{border-color:var(--line);background:var(--surface);box-shadow:0 8px 22px rgba(11,37,69,0.16);}
.pkg-header{padding:12px 16px;text-align:center;}
.pkg-header-name{font-family:Arial,sans-serif;font-size:15px;font-weight:700;color:#fff;}
.duration-pill{display:inline-block;margin-top:6px;background:rgba(255,255,255,0.25);color:#fff;font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:20px;}
.pkg-body{padding:12px 16px 14px;text-align:center;}
.pkg-tagline{font-size:13px;color:var(--ink);margin-bottom:10px;}
.pkg-rich .pkg-price{font-size:18px;}
.pkg-features{list-style:none;margin:16px 0 0;padding:0;text-align:left;border-top:1px solid var(--line);padding-top:14px;}
.pkg-features li{font-size:13px;color:var(--ink);padding:5px 0;display:flex;gap:8px;align-items:flex-start;}
.pkg-features li span{font-weight:700;}

.pay-options{display:grid;gap:10px;margin-top:6px;}
.pay-opt{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;box-shadow:0 1px 3px rgba(11,37,69,0.05);}
.pay-opt:hover{border-color:var(--blue);}
.pay-opt.selected{border-color:var(--blue);background:var(--surface-2);}
.pay-opt-top{display:flex;justify-content:space-between;align-items:center;}
.pay-opt-name{font-family:Arial,sans-serif;font-weight:600;font-size:14.5px;}
.pay-opt-extra{font-size:11.5px;color:var(--amber);font-weight:600;margin-top:3px;}
.pay-opt-desc{font-size:12.5px;color:var(--muted);margin-top:4px;}
.pay-total{font-family:Arial,sans-serif;font-weight:600;color:var(--blue-deep);}

.day-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px;}
.day-pill{flex:0 0 auto;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 15px;text-align:center;cursor:pointer;min-width:56px;touch-action:manipulation;transition:transform .12s ease, border-color .12s ease;}
.day-pill:hover{transform:translateY(-1px);border-color:var(--blue);}
.day-pill .dow{font-size:11px;color:var(--muted);text-transform:uppercase;}
.day-pill .num{font-family:Arial,sans-serif;font-size:17px;font-weight:600;}
.day-pill.selected{border-color:var(--blue);background:var(--surface-2);box-shadow:0 3px 10px rgba(92,100,214,0.14);}

.legend{display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap;}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
.legend-dot{width:9px;height:9px;border-radius:3px;}
.legend-dot.rec{background:var(--green);}
.legend-dot.ok{background:var(--surface);border:1.5px solid var(--line);}
.legend-dot.no{background:var(--surface);border:1.5px solid var(--line);opacity:.4;}

.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;}
.slot{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:13px 8px;text-align:center;cursor:pointer;font-family:Arial,sans-serif;font-weight:600;position:relative;touch-action:manipulation;transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;}
.slot:hover{border-color:var(--blue);transform:translateY(-1px);box-shadow:0 4px 10px rgba(11,37,69,0.08);}
.slot.selected{background:var(--blue);color:#fff;border-color:var(--blue);}
.slot.taken{opacity:.3;cursor:not-allowed;text-decoration:line-through;}
.slot.recommended{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset;}
.slot .rec-badge{display:block;font-family:Arial,sans-serif;font-size:8.5px;font-weight:700;color:var(--green-deep);text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px;}
.slot.selected .rec-badge{color:#fff;}
.empty-note{color:var(--muted);font-size:13px;padding:14px 0;}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.chip{background:var(--green);color:#fff;font-family:Arial,sans-serif;font-size:12.5px;font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer;touch-action:manipulation;}
.chip:hover{opacity:.85;}

label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;font-weight:500;}
input,select,textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;color:var(--ink);font-family:Arial,sans-serif;font-size:16px;transition:border-color .15s ease, box-shadow .15s ease;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(92,100,214,0.14);}
.inline-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.check-row{display:flex;align-items:center;gap:8px;margin:14px 0 6px;}
.sigpad-wrap{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:6px;margin-top:6px;}
.sigpad-wrap canvas{display:block;width:100%;height:120px;touch-action:none;cursor:crosshair;}
.sig-thumb{height:34px;border:1px solid var(--line);border-radius:6px;background:#fff;margin-top:4px;}
.module-signed{background:var(--surface-2);border:1.5px solid var(--green);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
.module-open{background:var(--surface-2);border:1.5px solid var(--blue);border-radius:10px;padding:14px;margin-bottom:10px;}
.hold-listing{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(11,37,69,0.05);}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 10px;}
.cal-nav-title{font-family:Arial,sans-serif;font-weight:700;font-size:16px;color:var(--blue-deep);}
.cal-nav button{background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px;}
.cal-day-grid{position:relative;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;}
.cal-hour-row{position:relative;height:50px;border-top:1px solid var(--line);}
.cal-hour-row:first-child{border-top:none;}
.cal-hour-label{position:absolute;top:-8px;left:6px;font-size:11px;color:var(--muted);background:var(--surface);padding:0 4px;}
.cal-event{position:absolute;left:56px;right:6px;background:var(--blue);color:#fff;border-radius:6px;padding:3px 8px;font-size:11.5px;overflow:hidden;box-shadow:0 2px 6px rgba(92,100,214,0.3);cursor:pointer;line-height:1.3;}
.cal-event.status-annulleret{background:var(--danger);opacity:.7;}
.cal-event.status-forfalden{background:var(--danger);}
.cal-week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-week-col{border:1.5px solid var(--line);border-radius:10px;padding:6px;background:var(--surface);min-height:120px;}
.cal-week-col-head{font-size:11px;font-weight:700;color:var(--muted);text-align:center;margin-bottom:6px;text-transform:uppercase;}
.cal-week-col-head.is-today{color:var(--blue);}
.cal-week-event{background:var(--blue);color:#fff;border-radius:5px;padding:3px 5px;font-size:10.5px;margin-bottom:4px;cursor:pointer;line-height:1.25;}
.cal-month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cal-month-head{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;padding-bottom:4px;}
.cal-month-cell{border:1.5px solid var(--line);border-radius:8px;padding:5px;min-height:56px;cursor:pointer;background:var(--surface);}
.cal-month-cell.other-month{opacity:.35;}
.cal-month-cell.is-today{border-color:var(--blue);border-width:2px;}
.cal-month-cell-num{font-size:12px;font-weight:600;color:var(--ink);}
.cal-month-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin:2px 1px 0 0;}
.hold-listing-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
.hold-listing-name{font-family:Arial,sans-serif;font-weight:700;font-size:16px;color:var(--blue-deep);}
.hold-pill{background:var(--gold);color:#fff;font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;white-space:nowrap;text-transform:uppercase;letter-spacing:.02em;}
.hold-listing-desc{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.5;}
.hold-listing-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.hold-btn{border:none;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;font-family:Arial,sans-serif;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease;}
.hold-btn:hover{transform:translateY(-1px);}
.hold-btn-signup{background:var(--blue-deep);color:#fff;box-shadow:0 3px 10px rgba(38,44,130,0.25);}
.hold-btn-info{background:var(--surface-2);color:var(--blue-deep);border:1.5px solid var(--blue);}
.check-row input{width:auto;}
.check-row label{margin:0;color:var(--ink);font-size:13px;}

.btn-row{display:flex;gap:10px;margin-top:26px;}
button.primary{background:var(--blue-deep);color:#fff;border:none;border-radius:10px;padding:14px 22px;font-family:Arial,sans-serif;font-weight:600;font-size:15px;cursor:pointer;flex:1;box-shadow:0 3px 10px rgba(38,44,130,0.2);touch-action:manipulation;transition:transform .15s ease, box-shadow .15s ease;}
button.primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px rgba(38,44,130,0.28);}
button.primary:active:not(:disabled){transform:translateY(0);box-shadow:0 2px 8px rgba(38,44,130,0.2);}
button.primary:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}
button.ghost{background:transparent;color:var(--blue-deep);border:1.5px solid var(--blue-deep);border-radius:10px;padding:14px 18px;font-family:Arial,sans-serif;font-weight:600;font-size:15px;cursor:pointer;touch-action:manipulation;transition:all .15s ease;}
button.ghost:hover{color:var(--blue-deep);border-color:var(--blue);}
.ghost-link{background:transparent;color:var(--muted);border:1.5px solid var(--line);border-radius:10px;padding:14px 18px;font-family:Arial,sans-serif;font-weight:500;font-size:15px;text-decoration:none;display:inline-block;text-align:center;flex:1;touch-action:manipulation;}
.ghost-link:hover{color:var(--blue-deep);border-color:var(--blue);}
button.small{background:transparent;border:1.5px solid var(--blue-deep);color:var(--blue-deep);font-size:12px;font-weight:600;padding:8px 14px;border-radius:8px;cursor:pointer;font-family:Arial,sans-serif;margin-top:12px;}
button.small:hover{border-color:var(--blue);}

.ticket{background:var(--surface);color:var(--ink);border-radius:16px;padding:0;overflow:hidden;margin-top:10px;border:1.5px solid var(--line);box-shadow:0 8px 22px rgba(11,37,69,0.08);}
.ticket-top{padding:24px 22px 20px;background:var(--surface);}
.ticket-top .tstatus{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--surface-2);color:var(--blue-deep);text-transform:uppercase;letter-spacing:.03em;}
.ticket-top h3{font-family:Arial,sans-serif;font-size:20px;margin:12px 0 2px;color:var(--ink);}
.ticket-top .ticket-row{border-top-color:var(--line);color:var(--ink);}
.ticket-top .ticket-row.total{color:var(--green-deep);}
.ticket-top .inv-table th{color:var(--muted);border-bottom-color:var(--line);}
.ticket-top .inv-table td{color:var(--ink);border-bottom-color:var(--line);}
.ticket-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-top:1px solid var(--line);gap:16px;}
.ticket-row span:last-child{text-align:right;}
.ticket-row.total{font-weight:700;font-size:16px;color:var(--green-deep);}
.ticket-perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 22px;}
.ticket-perf::before,.ticket-perf::after{content:'';position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--bg);}
.ticket-perf::before{left:-33px;}
.ticket-perf::after{right:-33px;}
.ticket-bottom{padding:18px 22px 22px;font-size:13px;}
.ticket-bottom .refid{font-family:Arial,sans-serif;font-weight:600;font-size:15px;background:var(--surface-2);padding:2px 8px;border-radius:6px;color:var(--blue-deep);}
.bank-box{background:var(--surface-2);border-radius:10px;padding:12px 14px;margin-top:10px;white-space:pre-line;font-family:Arial,sans-serif;font-size:12.5px;line-height:1.6;}
.inv-table{width:100%;border-collapse:collapse;margin:12px 0 4px;font-size:12.5px;}
.inv-table th{text-align:left;font-weight:600;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;padding:6px 4px;border-bottom:1px solid var(--line);}
.inv-table td{padding:8px 4px;border-bottom:1px solid var(--line);}
.inv-table th:nth-child(2),.inv-table th:nth-child(3),.inv-table th:nth-child(4),
.inv-table td:nth-child(2),.inv-table td:nth-child(3),.inv-table td:nth-child(4){text-align:right;white-space:nowrap;}

.admin-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.admin-tab{background:var(--surface);border:1.5px solid var(--blue-deep);color:var(--blue-deep);padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;font-family:Arial,sans-serif;font-weight:600;}
.admin-tab.active{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600;box-shadow:0 3px 10px rgba(217,113,31,0.3);}
.booking-card{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px;box-shadow:0 1px 3px rgba(11,37,69,0.05);transition:box-shadow .15s ease, border-color .15s ease;}
.booking-card:hover{box-shadow:0 4px 14px rgba(11,37,69,0.08);border-color:rgba(92,100,214,0.3);}
.bc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.bc-name{font-family:Arial,sans-serif;font-weight:600;font-size:15px;color:var(--blue-deep);}
.bc-meta{font-size:12.5px;color:var(--muted);margin-top:3px;}
.badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.02em;box-shadow:0 1px 3px rgba(11,37,69,0.12);}
.badge.afventer{background:var(--amber);color:white;}
.badge.bekraeftet{background:var(--blue);color:white;}
.badge.betalt{background:var(--green);color:white;}
.badge.annulleret{background:var(--danger);color:white;}
.badge.udeblevet{background:var(--muted);color:white;}
.badge.forfalden{background:var(--danger);color:white;}
.badge.delvist{background:var(--gold);color:white;}
.badge.forslag{background:var(--amber);color:white;}
.badge.tildelt{background:var(--teal);color:white;}
.bc-actions a{background:var(--surface);border:1.5px solid var(--line);color:var(--blue-deep);font-size:12.5px;padding:9px 14px;border-radius:8px;cursor:pointer;font-family:Arial,sans-serif;text-decoration:none;display:inline-block;touch-action:manipulation;}
.bc-actions a:hover{border-color:var(--blue);}
.assign-box{background:var(--surface-2);border:1.5px solid var(--green);border-radius:10px;padding:14px;margin-top:12px;}
.assign-box .slots{margin-top:10px;}
.req-text{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:4px;color:var(--ink);}
.bc-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
.bc-actions button{background:var(--surface);border:1.5px solid var(--line);color:var(--blue-deep);font-size:12.5px;padding:9px 14px;border-radius:8px;cursor:pointer;font-family:Arial,sans-serif;touch-action:manipulation;}
.bc-actions button:hover{border-color:var(--blue);}
.settings-box{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(11,37,69,0.05);}
.settings-box h4{font-family:Arial,sans-serif;font-size:14px;margin:22px 0 4px;color:var(--green-deep);text-transform:uppercase;letter-spacing:.03em;}
.settings-box h4:first-child{margin-top:0;}
.pin-gate{max-width:280px;margin:80px auto;text-align:center;}
.pin-gate input{text-align:center;letter-spacing:4px;font-size:18px;}
.small-note{font-size:12px;color:var(--muted);margin-top:8px;}

.rule-card{background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
.rule-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;flex-wrap:wrap;}

function todayIso(){ const d=new Date(); d.setHours(0,0,0,0); return isoDate(d); }
function plusDaysIso(n){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+n); return isoDate(d); }
function periodRange(period){
  const d = new Date(); d.setHours(0,0,0,0);
  if(period==='week'){
    const day = d.getDay();
    const diffToMonday = (day===0?-6:1-day);
    const monday = new Date(d); monday.setDate(d.getDate()+diffToMonday);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    return { start:isoDate(monday), end:isoDate(sunday) };
  }
  if(period==='month'){
    const first = new Date(d.getFullYear(), d.getMonth(), 1);
    const last = new Date(d.getFullYear(), d.getMonth()+1, 0);
    return { start:isoDate(first), end:isoDate(last) };
  }
  const t = isoDate(d);
  return { start:t, end:t };
}
function lessonsInRange(bookingsScoped, start, end){
  const list = [];
  bookingsScoped.forEach(b=>{
    if(b.status==='annulleret') return;
    (b.slots||[]).forEach(s=>{ if(s.date>=start && s.date<=end) list.push({b,s}); });
  });
  list.sort((a,b)=> (a.s.date+a.s.time).localeCompare(b.s.date+b.s.time));
  return list;
}
function groupLessonsByDate(list){
  const groups = {};
  list.forEach(item=>{ (groups[item.s.date]=groups[item.s.date]||[]).push(item); });
  return groups;
}
function renderLessonGroups(list, cardFn){
  if(!list.length) return `<p class="small-note">Ingen lektioner i denne periode.</p>`;
  const groups = groupLessonsByDate(list);
  const dates = Object.keys(groups).sort();
  return dates.map(d=>{
    const dd = new Date(d+'T00:00:00');
    return `
      <div class="small-note" style="margin:14px 0 6px;font-weight:600;color:var(--ink);">${DOW_FULL[dd.getDay()]} d. ${fmtDate(dd)}</div>
      ${groups[d].map(cardFn).join('')}
    `;
  }).join('');
}

function fmtDate(d){ return `${d.getDate()}. ${['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'][d.getMonth()]}`; }

function bookingTotal(b){ return b.totalPrice!==undefined ? b.totalPrice : (b.price||0); }
function paidAmountFor(b){
  const explicit = (b.payments||[]).reduce((s,p)=>s+(p.amount||0), 0);
  if(explicit>0) return explicit;
  return b.status==='betalt' ? bookingTotal(b) : 0;
}
function remainingAmountFor(b){ return Math.max(0, bookingTotal(b)-paidAmountFor(b)); }
function invoiceDueDate(b){ return new Date(new Date(b.createdAt).getTime() + (Number(state.settings.paymentDueDays)||9)*86400000); }
function isOverdue(b){
  if(!b.invoiceNumber || b.status==='annulleret') return false;
  if(bookingTotal(b)<=0) return false;
  if(remainingAmountFor(b)<=0) return false;
  return new Date() > invoiceDueDate(b);
}
function effectiveStatus(b){
  if(isOverdue(b)) return {key:'forfalden', label:'Forfalden'};
  const paid = paidAmountFor(b), total = bookingTotal(b);
  if(b.invoiceNumber && paid>0 && paid<total) return {key:'delvist', label:'Delvist betalt'};
  const labels = {afventer:'Afventer',bekraeftet:'Bekræftet',betalt:'Betalt',annulleret:'Annulleret',forslag:'Ønsker modtaget',tildelt:'Tid tildelt',udeblevet:'Udeblevet'};
  return {key:b.status, label:labels[b.status]||b.status};
}

  const amt = Number(amtStr);

  b.payments = b.payments||[];
  b.payments.push({ id:newId(), amount:amt, date:new Date().toISOString() });
  if(paidAmountFor(b) >= bookingTotal(b)) b.status='betalt';
  await saveBookings();
  render();
  showToast('Betaling registreret');
}
function isoDate(d){ return d.toISOString().slice(0,10); }
function nextDays(n){
  const out=[]; const today = new Date(); today.setHours(0,0,0,0);
  for(let i=0;i<n;i++){ const dd = new Date(today); dd.setDate(dd.getDate()+i); out.push(dd); }
  return out;
}
function mondayOf(d){
  const dd = new Date(d); dd.setHours(0,0,0,0);
  const day = dd.getDay();
  const diff = day===0 ? -6 : 1-day;
  dd.setDate(dd.getDate()+diff);
  return dd;
}
function ruleWeekMatches(rule, dateIso){
  const n = Number(rule.repeatWeeks)||1;
  if(n<=1) return true;
  const mondayD = mondayOf(new Date(dateIso+'T00:00:00'));
  const mondayS = mondayOf(new Date(rule.startDate+'T00:00:00'));
  const weeks = Math.round((mondayD-mondayS)/(7*86400000));
  return weeks>=0 && (weeks % n === 0);
}
function newId(){ return 'PD-'+Date.now().toString(36).toUpperCase().slice(-6)+Math.floor(Math.random()*36).toString(36); }

/* ---------- TIME / RANGE HELPERS ---------- */
function toMin(t){ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
function toHHMM(min){ const h=Math.floor(min/60).toString().padStart(2,'0'); const m=(min%60).toString().padStart(2,'0'); return `${h}:${m}`; }
function mergeRanges(ranges){
  const sorted=[...ranges].filter(r=>r.end>r.start).sort((a,b)=>a.start-b.start);
  const out=[];
  for(const r of sorted){
    if(out.length && r.start<=out[out.length-1].end){ out[out.length-1].end=Math.max(out[out.length-1].end,r.end); }
    else out.push({...r});
  }
  return out;
}
function subtractOne(base, sub){
  const out=[];
  for(const r of base){
    if(sub.end<=r.start || sub.start>=r.end){ out.push(r); continue; }
    if(sub.start>r.start) out.push({start:r.start, end:Math.min(sub.start,r.end)});
    if(sub.end<r.end) out.push({start:Math.max(sub.end,r.start), end:r.end});
  }
  return out.filter(r=>r.end>r.start);
}
function subtractMany(base, subs){
  let result=base;
  for(const s of subs) result = subtractOne(result, s);
  return result;
}

/* ---------- SCHEDULE ENGINE ---------- */
function getWorkingWindowsRaw(dateIso, instructorId){
  const weekday = new Date(dateIso+'T00:00:00').getDay();
  let windows=[];
  (state.settings.scheduleRules||[]).forEach(rule=>{
    if(dateIso<rule.startDate || dateIso>rule.endDate) return;
    if(!ruleWeekMatches(rule,dateIso)) return;
    if(instructorId && rule.instructorId && rule.instructorId!==instructorId) return;
    const wh = rule.week ? rule.week[weekday] : null;
    if(!wh || !wh.start || !wh.end) return;
    let segs=[{start:toMin(wh.start), end:toMin(wh.end)}];
    if(rule.breakStart && rule.breakEnd){
      segs = subtractOne(segs, {start:toMin(rule.breakStart), end:toMin(rule.breakEnd)});
    }
    windows.push(...segs);
  });
  windows = mergeRanges(windows);
  const blocks = (state.settings.blockedRanges||[]).filter(b=>b.date===dateIso && (!instructorId || !b.instructorId || b.instructorId===instructorId)).map(b=>({start:toMin(b.start), end:toMin(b.end)}));
  windows = subtractMany(windows, blocks);
  const forced = (state.settings.forceOpenSlots||[]).filter(f=>f.date===dateIso && (!instructorId || !f.instructorId || f.instructorId===instructorId)).map(f=>({start:toMin(f.start), end:toMin(f.end)}));
  windows = mergeRanges([...windows, ...forced]);
  return windows;
}
function defaultDuration(){ return Number(state.settings.lessonDurationMinutes)||90; }
function getBookedIntervals(dateIso, instructorId){
  const D = defaultDuration();
  const out=[];
  state.bookings.forEach(b=>{
    if(b.status==='annulleret') return;
    if(instructorId && b.instructorId && b.instructorId!==instructorId) return;
    (b.slots||[]).forEach(s=>{ if(s.date===dateIso){ const st=toMin(s.time); out.push({start:st, end:st+(b.durationMinutes||D)}); } });
  });
  return out;
}
function scoreSlot(gapBefore, gapAfter, D, windowSize){
  let score=0; const reasons=[];
  const bothAdjacent = gapBefore===0 && gapAfter===0;
  if(bothAdjacent){ score+=100; reasons.push('Fylder et eksisterende hul helt.'); }
  else{
    if(gapBefore===0){ score+=50; reasons.push('Ligger lige efter forrige booking.'); }
    if(gapAfter===0){ score+=50; reasons.push('Ligger lige før næste booking.'); }
  }
  [['før',gapBefore],['efter',gapAfter]].forEach(([label,g])=>{
    if(g>0){
      if(g>=D){ score+=30; reasons.push(`Efterlader ${g} min ${label} — nok til en hel køretime mere.`); }
      else{ score-=100; reasons.push(`Efterlader ${g} min ${label} — for lidt til en hel time.`); }
    }
  });
  if(!bothAdjacent && gapBefore>0 && gapAfter>0 && windowSize>=3*D){
    score-=50; reasons.push('Splitter en stor ledig periode i to.');
  }
  return {score, reason:reasons.join(' ')};
}
/*
 * Core availability engine — duration-agnostic.
 * Computes every possible start time within the working hours for a given
 * date, validating that the FULL requested duration is continuously free
 * (not just that the start minute itself is unoccupied). Works identically
 * for 90-minute lessons, 45-minute lessons, or any future duration (30, 60,
 * 120, 180…) — nothing here needs to change to support a new duration.
 */
function computeDaySlots(dateIso, instructorId, duration){
  const D = Number(duration)||defaultDuration();
  const smart = state.settings.smartSchedulingEnabled!==false;
  const raw = getWorkingWindowsRaw(dateIso, instructorId);
  const booked = getBookedIntervals(dateIso, instructorId);
  const free = mergeRanges(subtractMany(raw, booked));
  const byStart = {};
  raw.forEach(w=>{
    for(let t=w.start; t+D<=w.end; t+=15){
      // A slot is only valid if the ENTIRE [t, t+D] range is free —
      // continuous-range validation, not a single-point lookup.
      const overlaps = booked.some(b=> t<b.end && (t+D)>b.start);
      const key = toHHMM(t);
      if(overlaps){
        if(!byStart[key]) byStart[key]={start:key, available:false, score:null, recommended:false, reason:'Optaget'};
        continue;
      }
      const seg = free.find(f=> t>=f.start && (t+D)<=f.end);
      if(!seg) continue; // the full duration doesn't fit inside any continuous free window
      const gapBefore=t-seg.start, gapAfter=seg.end-(t+D), windowSize=seg.end-seg.start;
      let sc=0, reason='Ledig tid.';
      if(smart){ const r=scoreSlot(gapBefore,gapAfter,D,windowSize); sc=r.score; reason=r.reason; }
      byStart[key]={start:key, available:true, score:sc, recommended:false, reason, gapBefore, gapAfter};
    }
  });
  const list = Object.values(byStart).sort((a,b)=>a.start.localeCompare(b.start));
  if(smart){
    const avail = list.filter(c=>c.available);
    if(avail.length){
      const maxScore = Math.max(...avail.map(c=>c.score));
      if(maxScore>0) list.forEach(c=>{ if(c.available && c.score===maxScore) c.recommended=true; });
    }
  }
  return list;
}
function openDaysList(n, instructorId, duration){
  return nextDays(n).filter(dd=>computeDaySlots(isoDate(dd), instructorId, duration).some(c=>c.available));
}
function slotFree(dateIso, time, instructorId, duration){
  const D = Number(duration)||defaultDuration();
  const t = toMin(time);
  const raw = getWorkingWindowsRaw(dateIso, instructorId);
  const inWindow = raw.some(w=> t>=w.start && (t+D)<=w.end);
  if(!inWindow) return false;
  const booked = getBookedIntervals(dateIso, instructorId);
  return !booked.some(b=> t<b.end && (t+D)>b.start);
}

function normPhone(p){ return (p||'').replace(/\D/g,''); }
async function hashText(text){
  const enc = new TextEncoder().encode(String(text));
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function runningBalanceFor(phone){
  const np = normPhone(phone);
  return state.bookings
    .filter(b=>b.paymentMethod==='lobende' && !b.settled && b.status!=='annulleret' && normPhone(b.phone)===np)
    .reduce((sum,b)=>sum+(b.price||0), 0);
}
function spendingSummaryFor(phone){
  const np = normPhone(phone);
  const mine = state.bookings.filter(b=>normPhone(b.phone)===np && b.status!=='annulleret');
  const byItem = {};
  mine.forEach(b=>{
    const amt = b.totalPrice!==undefined ? b.totalPrice : (b.price||0);
    if(!byItem[b.itemName]) byItem[b.itemName] = 0;
    byItem[b.itemName] += amt;
  });
  const items = Object.keys(byItem).map(name=>({name, amount:byItem[name]})).sort((a,b)=>b.amount-a.amount);
  const total = items.reduce((s,i)=>s+i.amount, 0);
  return { items, total };
}
function transactionHistoryFor(phone){
  const np = normPhone(phone);
  const mine = state.bookings.filter(b=>normPhone(b.phone)===np && b.status!=='annulleret');
  const entries = [];
  mine.forEach(b=>{
    const amt = bookingTotal(b);
    entries.push({ type:'køb', date:b.createdAt, label:b.itemName+(( b.quantity||1)>1?` × ${b.quantity}`:''), amount:amt });
    (b.payments||[]).forEach(p=>{
      entries.push({ type:'betaling', date:p.date, label:`Betaling — ${b.itemName}${b.invoiceNumber?' (faktura #'+b.invoiceNumber+')':''}`, amount:-p.amount });
    });
    if(b.paymentMethod==='lobende' && b.settled){
      entries.push({ type:'afregning', date:b.settledAt||b.createdAt, label:`Afregnet på faktura #${b.settledInvoiceNumber}`, amount:-amt });
    }
  });
  return entries.sort((a,b)=>new Date(a.date)-new Date(b.date));
}
function studentLessonProgress(student){
  const np = normPhone(student.phone);
  const pkgBooking = state.bookings.find(b=>normPhone(b.phone)===np && b.itemType==='pakke' && b.status!=='annulleret');
  if(!pkgBooking) return null;
  const pkg = state.settings.packages[pkgBooking.itemKey];
  if(!pkg) return null;
  const total = Number(pkg.roadLessons)||0;
  const taken = Math.min(total, Number(student.roadLessonsTaken)||0);
  return { packageName: pkg.name, total, taken, remaining: Math.max(0, total-taken) };
}
function studentCosts(student){
  const np = normPhone(student.phone);
  const pkgBookings = state.bookings.filter(b=>normPhone(b.phone)===np && b.itemType==='pakke' && b.status!=='annulleret');
  const categories = (state.settings.budget && state.settings.budget.categories) || [];
  const totals = {}; categories.forEach(c=>totals[c.id]=0);
  pkgBookings.forEach(b=>{
    const pk = state.settings.packages[b.itemKey];
    if(pk && pk.lessonCounts){
      categories.forEach(c=>{ totals[c.id] += Number(pk.lessonCounts[c.id])||0; });
    }
  });
  const bd = state.settings.budget||{};
  let cost = 0;
  categories.forEach(c=>{ cost += totals[c.id]*((Number(c.udgift)||0)+(Number(c.loen)||0)); });
  cost += pkgBookings.length ? (Number(bd.ekstraUdgiftPerElev)||0) : 0;
  return { totals, categories, cost };
}
function studentByPhone(phone){
  const np = normPhone(phone);
  return state.students.find(s=>normPhone(s.phone)===np);
}
function instructorStudents(instructorId){

function instructorRevenue(instructorId){

}

async function adjustRoadLessons(studentId, delta){
  const st = state.students.find(s=>s.id===studentId);
  if(!st) return;
  const lp = studentLessonProgress(st);
  const max = lp ? lp.total : 999;
  st.roadLessonsTaken = Math.max(0, Math.min(max, (Number(st.roadLessonsTaken)||0)+delta));
  if(state.currentStudent && state.currentStudent.id===studentId) state.currentStudent = st;
  await saveStudents();
  render();

function renderBookingConfirmation(b){
  const slotsStr = (b.slots||[]).map(s=>`${DOW_FULL[new Date(s.date+'T00:00:00').getDay()]} d. ${fmtDate(new Date(s.date+'T00:00:00'))} kl. ${s.time}`).join(' · ');
  const waitingOnTime = !slotsStr && (b.requestedText || (b.requestedWindows||[]).length);
  return `
    <div class="step active">
      <div class="ticket">
        <div class="ticket-top">
          <span class="tstatus">Booket</span>
          <h3>${b.itemName}${(b.quantity||1)>1?` × ${b.quantity}`:''}</h3>
          ${slotsStr ? `<div class="ticket-row"><span>Tidspunkt</span><span>${slotsStr}</span></div>` : ''}
          ${waitingOnTime ? `<div class="ticket-row"><span>Tid</span><span>Afventer bekræftelse fra kørelæren</span></div>` : ''}
          ${b.instructorName ? `<div class="ticket-row"><span>Kørelærer</span><span>${b.instructorName}</span></div>` : ''}
        </div>
        <div class="ticket-bottom">
          <div class="small-note" style="margin-top:0;">Din booking er registreret. Kvittering, betaling og faktura finder du under "Økonomi".</div>
          ${b.slots && b.slots.length ? `<div class="btn-row"><a href="${icsHref(b)}" download="booking.ics" style="text-decoration:none;text-align:center;padding:12px;border:1.5px solid var(--line);border-radius:10px;flex:1;color:var(--ink);">📅 Tilføj til kalender</a></div>` : ''}
        </div>
      </div>
      <div class="btn-row sticky-mobile">
        <button class="ghost" onclick="resetStudent()">← Tilbage til oversigt</button>
        <button class="primary" onclick="showEconomy()">Se i Økonomi →</button>
      </div>
    </div>
  `;
}
function renderStudent(){
  if(!state.currentStudent) return renderAuth();
  if(state.studentPanel==='mybookings') return renderMyBookings();
  if(state.studentPanel==='progress') return renderMyProgress();
  if(state.studentPanel==='faq') return renderFAQ();
  if(state.studentPanel==='chat') return renderStudentChat();
  if(state.studentPanel==='groups') return renderMyGroups();
  if(state.studentPanel==='groupchat') return renderGroupChat();
  if(state.studentPanel==='upcoming') return renderUpcoming();
  if(state.studentPanel==='economy') return renderEconomy();
  if(state.studentPanel==='contacts') return renderContacts();
  if(state.studentPanel==='dashboard') return renderStudentDashboard();
  if(state.lastBooking) return renderBookingConfirmation(state.lastBooking);
  if(state.step===1) return renderSelectStep();
  if(state.step===2) return renderTimeStep();
  if(state.step===3) return renderFormStep();
}

function emptyLoginForm(){ return {phone:'',password:''}; }
function emptySignupForm(){ return {name:'',phone:'',email:'',address:'',password:'',password2:'',gearChoice:'',commPreference:'sms'}; }
function switchAuthView(v){ state.authView=v; render(); }

function updateSignupForm(k,v){ state.signupForm[k]=v; }
function selectSignupGear(key){ state.signupForm.gearChoice=key; render(); }
async function doLogin(){
  const lf = state.loginForm;
  if(!lf.phone.trim() || !lf.password){ showToast('Udfyld telefon og adgangskode'); return; }
  const np = normPhone(lf.phone);
  const student = state.students.find(s=>normPhone(s.phone)===np);
  const hash = await hashText(lf.password);
  if(!student || student.passwordHash !== hash){ showToast('Forkert telefonnummer eller adgangskode'); return; }
  state.currentStudent = student;
  state.form = {name:student.name, phone:student.phone, email:student.email||'', address:student.address||''};
  state.loginForm = emptyLoginForm();
  state.studentPanel = 'dashboard';
  showToast(`Velkommen tilbage, ${student.name}!`);
  render();
}
async function doSignup(){
  const sf = state.signupForm;
  if(!sf.name.trim() || !sf.phone.trim() || !sf.password){ showToast('Udfyld navn, telefon og adgangskode'); return; }
  if(sf.password.length<4){ showToast('Adgangskoden skal være mindst 4 tegn'); return; }
  if(sf.password!==sf.password2){ showToast('Adgangskoderne matcher ikke'); return; }
  const np = normPhone(sf.phone);
  if(state.students.some(s=>normPhone(s.phone)===np)){ showToast('Der findes allerede en konto med det telefonnummer — log ind i stedet'); return; }
  const passwordHash = await hashText(sf.password);
  const student = { id:newId(), name:sf.name.trim(), phone:sf.phone.trim(), email:sf.email.trim(), address:sf.address.trim(), passwordHash, gearChoice:sf.gearChoice||'', commPreference:sf.commPreference||'sms', completedModules:[], moduleProgress:{}, assignedInstructorId:'', roadLessonsTaken:0, contacts:[], createdAt:new Date().toISOString() };
  state.students.push(student);
  await saveStudents();
  state.currentStudent = student;
  state.form = {name:student.name, phone:student.phone, email:student.email, address:student.address};
  state.signupForm = emptySignupForm();
  state.studentPanel = 'dashboard';
  showToast(`Konto oprettet — velkommen, ${student.name}!`);
  render();
}

  state.currentStudent=null; state.studentPanel=null; state.authView='login';

async function confirmStudentCancel(id){
  const b = state.bookings.find(x=>x.id===id);
  if(!b) return;
  if(b.slots && b.slots.length){
    const now = new Date();
    const soon = b.slots.some(s=>{
      const dt = new Date(s.date+'T'+s.time+':00');
      return (dt-now) < 24*3600*1000 && (dt-now) >= -24*3600*1000;
    });
    if(soon && !confirm('Denne tid er under 24 timer væk. Ifølge skolens politik kan du miste lektionen ved at aflyse nu. Vil du fortsætte?')) return;
  }
  const note = (state.cancelNoteText||'').trim();
  b.status = 'annulleret';
  b.cancelReason = note;
  await saveBookings();
  const st = state.currentStudent;
  const slotStr = (b.slots||[]).map(s=>`${fmtDate(new Date(s.date+'T00:00:00'))} kl. ${s.time}`).join(', ') || b.itemName;
  state.messages.push({
    id:newId(), phone:st.phone, studentName:st.name, sender:'student', senderName:st.name,
    text:`Jeg har aflyst min tid (${b.itemName}, ${slotStr}).${note?' Note: '+note:''}`,
    createdAt:new Date().toISOString()
  });
  await saveMessages();
  state.cancelBookingId=null; state.cancelNoteText='';
  render();
  showToast('Tid aflyst — kørelæreren er blevet informeret');
}

function showDashboard(){ state.studentPanel='dashboard'; state.lastBooking=null; render(); }
function showMyProgress(){ state.studentPanel='progress'; state.lastBooking=null; render(); }
function renderMyProgress(){
  const modules = state.settings.modules||[];
  const progress = state.currentStudent.moduleProgress||{};
  const done = modules.filter(m=>progress[m.id] && progress[m.id].signedAt);
  const pct = modules.length ? Math.round((done.length/modules.length)*100) : 0;
  const lp = studentLessonProgress(state.currentStudent);
  const lessonPct = lp && lp.total ? Math.round((lp.taken/lp.total)*100) : 0;
  return `
    <div class="step active">
      <div class="step-label">Dit forløb</div>
      <h2>Mit forløb</h2>
      ${lp ? `
        <div class="pay-opt selected" style="margin-bottom:18px;">
          <div class="pay-opt-top"><div class="pay-opt-name">Køretimer på vej</div><div class="pay-total">${lp.taken} af ${lp.total}</div></div>
          <div class="pay-opt-desc">${lp.remaining} lektion${lp.remaining!==1?'er':''} tilbage af din ${lp.packageName}.</div>
          <div style="background:var(--line);border-radius:20px;height:8px;margin-top:10px;overflow:hidden;">
            <div style="background:var(--green);height:100%;width:${lessonPct}%;"></div>
          </div>
        </div>
      ` : ''}
      ${modules.length ? `
        <p class="small-note" style="margin-top:0;margin-bottom:14px;">Du har fået underskrevet <strong style="color:var(--ink)">${done.length} af ${modules.length}</strong> moduler (${pct}%).</p>
        ${modules.map(m=>{
          const p = progress[m.id];
          const isSigned = p && p.signedAt;
          return `
          <div class="pkg" style="border-left:4px solid ${isSigned?'var(--green)':'var(--line)'};">
            <div class="pkg-top">
              <div class="pkg-name">${m.name}</div>
              <div class="pkg-price" style="color:${isSigned?'var(--green-deep)':'var(--muted)'};font-size:13px;">${isSigned?'✓ Underskrevet':'Mangler'}</div>
            </div>
            ${m.description ? `<div class="pkg-desc">${m.description}</div>` : ''}
            ${isSigned ? `
              <div class="pkg-desc">Underskrevet af ${p.signedByName} d. ${fmtDateFull(new Date(p.signedAt))}</div>
              ${p.signatureDataUrl ? `<img class="sig-thumb" src="${p.signatureDataUrl}">` : ''}
            ` : ''}
          </div>`;
        }).join('')}
      ` : `<p class="small-note">Din kørelærer har ikke oprettet dit forløb endnu.</p>`}
      <div class="btn-row sticky-mobile">
        <button class="ghost" onclick="showDashboard()">← Tilbage til oversigt</button>
      </div>
    </div>
  `;
}

function ncSet(key,val){ state.newContact = state.newContact||emptyContactForm(); state.newContact[key]=val; }
function contactSmsHref(contactName, contactPhone, pin, studentName){
  let digits = normPhone(contactPhone);
  if(digits.length===8) digits='45'+digits;
  const link = window.location.href.split('#')[0].split('?')[0];
  const msg = `Hej ${contactName}! Du er valgt som kontaktperson for ${studentName} hos ${state.settings.schoolName}. Log ind her: ${link} — tryk "Forælder-login" og brug denne PIN: ${pin}`;
  return `sms:+${digits}?body=${encodeURIComponent(msg)}`;
}
function contactMailtoHref(contactName, contactEmail, pin, studentName){
  const link = window.location.href.split('#')[0].split('?')[0];
  const subject = `Du er kontaktperson for ${studentName} hos ${state.settings.schoolName}`;
  const body = `Hej ${contactName}!\n\nDu er valgt som kontaktperson for ${studentName} hos ${state.settings.schoolName}.\n\nLog ind her: ${link}\nTryk "Forælder-login" og brug denne PIN: ${pin}\n\nDu kan se de beskeder, der sendes mellem ${studentName} og køreskolen — du kan ikke selv skrive.`;
  return `mailto:${encodeURIComponent(contactEmail)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}
function startPackagePurchase(key){
  const pk = state.settings.packages[key];
  if(!pk) return;
  const it = { type:'pakke', key, name:pk.name, price:Number(pk.price)||0, quantity:1 };
  state.category='pakker';
  state.selectedItem=it;
  state.selectedQuantity=1;
  state.selectedSlots=[];
  state.bookingMode='calendar';
  state.selectedPayment='bank';
  state.studentPanel=null;
  state.step=3;
  render();
}
function renderEconomy(){
  const np = normPhone(state.currentStudent.phone);
  const balance = runningBalanceFor(state.currentStudent.phone);
  const spend = spendingSummaryFor(state.currentStudent.phone);

function quickBookExtra(){
  const price = Number(state.settings.extraLessonPrice)||0;
  const duration = Number(state.settings.lessonDurationMinutes)||90;
  const it = { type:'ekstra', key:'ekstra', name:'Ekstra lektion', price, quantity:1, durationMinutes:duration };
  state.category='ekstra';
  state.selectedItem=it;
  state.selectedQuantity=1;
  state.selectedDuration=90;
  state.selectedLocationId='';
  state.bookingMode='calendar';
  const instructors = state.settings.instructors||[];
  if(instructors.length){ state.selectedInstructorId = instructors[0].id; }
  const instructorId = instructors.length>1 ? state.selectedInstructorId : null;
  const days = openDaysList(90, instructorId, duration);
  let best=null;
  for(const dd of days){
    const dISO = isoDate(dd);
    const slots = computeDaySlots(dISO, instructorId, duration).filter(c=>c.available);
    if(!slots.length) continue;
    slots.sort((a,b)=> (b.score-a.score) || a.start.localeCompare(b.start));
    best = { date:dISO, time:slots[0].start };
    break;
  }
  if(!best){ showToast('Ingen ledige tider fundet lige nu'); goToCategory('ekstra'); return; }
  state.selectedDate = best.date;
  state.selectedSlots = [{date:best.date, time:best.time}];
  state.step = 3;
  render();
  showToast(`Fundet ledig tid: ${fmtDate(new Date(best.date+'T00:00:00'))} kl. ${best.time}`);
}

function weeklyRequestCount(phone){
  const np = normPhone(phone);
  const weekAgo = Date.now() - 7*86400000;
  return state.bookings.filter(b=>b.isRequest && normPhone(b.phone)===np && new Date(b.createdAt).getTime()>=weekAgo).length;
}
function weeklyLessonCount(phone){
  const np = normPhone(phone);
  const weekAgo = Date.now() - 7*86400000;
  let count = 0;
  state.bookings.forEach(b=>{
    if(b.status==='annulleret') return;
    if(normPhone(b.phone)!==np) return;
    if(new Date(b.createdAt).getTime() < weekAgo) return;
    count += Math.max(1, (b.slots||[]).length || (b.requestedWindows||[]).length || 1);
  });
  return count;
}
function bestSlotForWindow(win, instructorId, duration){
  const D = Number(duration)||defaultDuration();
  const startMin = toMin(win.start), endMin = toMin(win.end);
  if(startMin==null || endMin==null) return null;
  const daySlots = computeDaySlots(win.date, instructorId, D).filter(c=>c.available);
  const inWindow = daySlots.filter(c=>{ const t=toMin(c.start); return t>=startMin && (t+D)<=endMin; });
  if(!inWindow.length) return null;
  inWindow.sort((a,b)=> (b.score-a.score) || a.start.localeCompare(b.start));
  return inWindow[0];
}

  const feePct = Number(state.settings.gatewayFeePercent)||0;
  const fee = state.selectedPayment==='gateway' ? Math.round(base*feePct)/100 : 0;
  return { base, fee, total: base+fee };
}

async function submitBooking(){
  const it = state.selectedItem;
  const t = calcTotals();
  const isFree = t.base===0;
  const isRunning = it.type==='ekstra' && !isFree;
  const isRequest = state.bookingMode==='request' && (it.type==='ekstra' || (it.type==='proeve' && it.key==='praktisk'));
  const instructors = state.settings.instructors||[];
  const instructorId = instructors.length>1 ? state.selectedInstructorId : (instructors[0] ? instructors[0].id : null);
  const instructor = instructors.find(i=>i.id===instructorId);

  if(!isRequest){
    // best-effort re-check against the freshest data right before writing, to reduce (not fully eliminate) race conditions
    try{
      const fresh = await S.get('bookings', true);
      state.bookings = fresh ? JSON.parse(fresh.value) : [];
    }catch(e){ /* keep local copy if fetch fails */ }

    const conflict = state.selectedSlots.some(s=>!slotFree(s.date,s.time, instructors.length>1 ? instructorId : null, it.durationMinutes));
    if(conflict){
      showToast('En eller flere valgte tider er lige blevet booket af en anden — vælg venligst igen.');
      state.step=2; state.selectedSlots=[];
      render();
      return;
    }
  }

  const validWindows = isRequest ? state.requestWindows.filter(w=>w.date && w.start && w.end) : [];
  const newLessonCount = Math.max(1, isRequest ? validWindows.length : state.selectedSlots.length);
  const priorLessonCount = weeklyLessonCount(state.form.phone);

  const booking = {
    id:newId(),
    name:state.form.name.trim(),
    phone:state.form.phone.trim(),
    email:state.form.email.trim(),
    address:state.form.address.trim(),
    itemType:it.type, itemKey:it.key, itemName:it.name,
    quantity:it.quantity||1, unitPrice:it.price, price:t.base,
    durationMinutes: it.durationMinutes || (Number(state.settings.lessonDurationMinutes)||90),
    instructorId: instructorId||'', instructorName: instructor ? instructor.name : '',
    locationId: state.selectedLocationId||'',
    paymentMethod: isFree ? 'ingen' : isRunning ? 'lobende' : state.selectedPayment,
    gatewayFee: (isFree||isRunning) ? 0 : t.fee,
    totalPrice: isFree ? 0 : isRunning ? t.base : t.total,
    settled: isRunning ? false : undefined,
    slots: isRequest ? [] : state.selectedSlots.slice(),
    isRequest: isRequest,
    requestedWindows: validWindows,
    requestedText: isRequest ? (state.requestText||'').trim() : '',
    flaggedExcessive: (priorLessonCount + newLessonCount) > 3,
    flaggedAcknowledged: false,
    status: isRequest ? 'forslag' : 'afventer',
    createdAt:new Date().toISOString()
  };
  if(!isFree && !isRunning) await ensureInvoiceNumber(booking);
  state.bookings.push(booking);
  if(booking.instructorId && state.currentStudent && normPhone(state.currentStudent.phone)===normPhone(booking.phone) && !state.currentStudent.assignedInstructorId){
    state.currentStudent.assignedInstructorId = booking.instructorId;
    const st = state.students.find(s=>s.id===state.currentStudent.id);
    if(st) st.assignedInstructorId = booking.instructorId;
    await saveStudents();
  }
  await saveBookings();
  state.lastBooking = booking;
  render();
}

  const vatBlock = (isInvoice && state.settings.showVat) ? (()=>{

function printTicket(id){ window.print(); }
function icsEscape(s){ return String(s||'').replace(/[\\;,]/g, m=>'\\'+m).replace(/\n/g,'\\n'); }
function icsDate(d){ return d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z'; }
function buildIcsForBooking(b){
  if(!b.slots || !b.slots.length) return null;
  const D = b.durationMinutes || Number(state.settings.lessonDurationMinutes)||90;
  const dtstamp = icsDate(new Date());
  const events = b.slots.map((s,i)=>{
    const start = new Date(s.date+'T'+s.time+':00');
    const end = new Date(start.getTime()+D*60000);
    return [
      'BEGIN:VEVENT',
      `UID:${b.id}-${i}@${(state.settings.schoolName||'plusdrive').replace(/\s+/g,'').toLowerCase()}`,
      `DTSTAMP:${dtstamp}`,
      `DTSTART:${icsDate(start)}`,
      `DTEND:${icsDate(end)}`,
      `SUMMARY:${icsEscape(b.itemName+' - '+state.settings.schoolName)}`,
      `DESCRIPTION:${icsEscape('Booking-ID: '+b.id+(b.instructorName?(' · Kørelærer: '+b.instructorName):''))}`,
      'END:VEVENT'
    ].join('\r\n');
  }).join('\r\n');
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//${state.settings.schoolName}//Booking//DA\r\nCALSCALE:GREGORIAN\r\n${events}\r\nEND:VCALENDAR`;
}
function icsHref(b){
  const ics = buildIcsForBooking(b);
  if(!ics) return '#';
  return `data:text/calendar;charset=utf8,${encodeURIComponent(ics)}`;
}
function buildIcsForSlot(b, s){
  const D = b.durationMinutes || Number(state.settings.lessonDurationMinutes)||90;
  const start = new Date(s.date+'T'+s.time+':00');
  const end = new Date(start.getTime()+D*60000);
  const dtstamp = icsDate(new Date());
  const event = [
    'BEGIN:VEVENT',
    `UID:${b.id}-${s.date}-${s.time}@${(state.settings.schoolName||'plusdrive').replace(/\s+/g,'').toLowerCase()}`,
    `DTSTAMP:${dtstamp}`,
    `DTSTART:${icsDate(start)}`,
    `DTEND:${icsDate(end)}`,
    `SUMMARY:${icsEscape(b.itemName+' - '+state.settings.schoolName)}`,
    `DESCRIPTION:${icsEscape('Booking-ID: '+b.id+(b.instructorName?(' · Kørelærer: '+b.instructorName):'')+(b.name?(' · Elev: '+b.name):''))}`,
    'END:VEVENT'
  ].join('\r\n');
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//${state.settings.schoolName}//Booking//DA\r\nCALSCALE:GREGORIAN\r\n${event}\r\nEND:VCALENDAR`;
}
function icsHrefForSlot(b, s){
  return `data:text/calendar;charset=utf8,${encodeURIComponent(buildIcsForSlot(b,s))}`;
}

async function doInstructorSignup(){
  const f = state.instructorSignupForm;
  const name = f.name.trim();
  if(!name){ showToast('Skriv dit navn'); return; }
  if(!f.pin || f.pin.length<4){ showToast('PIN skal være mindst 4 tegn'); return; }
  if(f.pin!==f.pin2){ showToast('PIN-koderne matcher ikke'); return; }
  const pinHash = await hashText(f.pin);
  if(pinHash===state.settings.adminPinHash){ showToast('Den PIN er reserveret — vælg en anden'); return; }
  const clash = (state.settings.instructors||[]).some(i=>i.pinHash===pinHash);
  if(clash){ showToast('Den PIN er allerede i brug — vælg en anden'); return; }
  const instructor = { id:newId(), name, pinHash };
  state.settings.instructors = state.settings.instructors||[];
  state.settings.instructors.push(instructor);
  await saveSettings();
  state.adminRole='instructor'; state.currentInstructor=instructor;
  state.view='admin'; state.adminTab='dashboard';

function renderCalMonthView(bookingsScoped){

function isoWeekNumber(d){
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = dt.getUTCDay()||7;
  dt.setUTCDate(dt.getUTCDate()+4-dayNum);
  const yearStart = new Date(Date.UTC(dt.getUTCFullYear(),0,1));
  return Math.ceil((((dt-yearStart)/86400000)+1)/7);
}

      const isSelected = state.assignSlots.some(s=>s.date===w.date && s.time===best.start);
      return `<div class="pay-opt ${isSelected?'selected':''}" style="margin-bottom:8px;" onclick="assignPickSlot('${w.date}','${best.start}')">

        <div class="pay-opt-desc">${best.reason||''}</div>
      </div>`;
    }).join('')}
  ` : '';
  return `
    <div class="assign-box">
      ${instructorPicker}
      ${suggestionsHtml}
      <label>Eller vælg selv en anden dato</label>
      <select onchange="setAssignDate(this.value)">${dayOptions}</select>

}

async function setStatus(id, status){
  const b = state.bookings.find(x=>x.id===id);
  if(!b) return;
  if((status==='bekraeftet' || status==='betalt' || status==='tildelt') && b.flaggedExcessive && !b.flaggedAcknowledged){
    if(!confirm(`${b.name} har booket mere end 3 kørsler denne uge. Tjek om det stemmer. Vil du godkende og fortsætte?`)) return;
    b.flaggedAcknowledged = true;
  }
  if(status==='annulleret'){
    if(b.slots && b.slots.length){
      const now = new Date();
      const soon = b.slots.some(s=>{
        const dt = new Date(s.date+'T'+s.time+':00');
        return (dt-now) < 24*3600*1000 && (dt-now) >= -24*3600*1000;
      });
      if(soon && !confirm('Denne tid er under 24 timer væk. Ifølge jeres politik mister eleven lektionen ved afbestilling nu. Fortsæt med at annullere?')) return;
    }
    const reason = prompt('Årsag til aflysning (valgfri) — sendes som besked til eleven. Fx Sygdom, Arbejde, Skole, Andet:', b.cancelReason||'');
    if(reason===null) return;
    b.cancelReason = reason.trim();
    const slotStr = (b.slots||[]).map(s=>`${fmtDate(new Date(s.date+'T00:00:00'))} kl. ${s.time}`).join(', ') || b.itemName;
    const senderName = state.currentInstructor ? state.currentInstructor.name : state.settings.schoolName;
    state.messages.push({
      id:newId(), phone:b.phone, studentName:b.name, sender:'staff', senderName,
      text:`Din tid er aflyst (${b.itemName}, ${slotStr}).${reason.trim()?' Note: '+reason.trim():''}`,
      createdAt:new Date().toISOString()
    });
    await saveMessages();
  }
  b.status=status; await saveBookings(); render(); showToast('Status opdateret');
}
function buildSmsMessage(b){
  const timesStr = (b.slots||[]).map(s=>{
    const d = new Date(s.date+'T00:00:00');
    return `${DOW_FULL[d.getDay()]} d. ${fmtDate(d)} kl. ${s.time}`;
  }).join(', ');
  let msg = `Hej ${b.name}! `;
  msg += b.isRequest
    ? `Vi har fundet en tid til din ${b.itemName}: ${timesStr}. `
    : `Din booking af ${b.itemName} er bekræftet til: ${timesStr}. `;
  msg += `Passer tidspunktet slet ikke, så svar venligst og anmod om en ny tid. `;
  msg += `OBS: Afbestiller du mindre end 24 timer før, mister du lektionen. `;

  return msg;
}

async function toggleGroupStudent(groupId, phone, checked){
  const g = state.groups.find(x=>x.id===groupId);
  if(!g) return;
  g.studentPhones = g.studentPhones||[];
  const np = normPhone(phone);
  if(checked){ if(!g.studentPhones.some(p=>normPhone(p)===np)) g.studentPhones.push(phone); }
  else{ g.studentPhones = g.studentPhones.filter(p=>normPhone(p)!==np); }
  await saveGroups();
  render();
}
async function toggleGroupInstructor(groupId, instructorId, checked){
  const g = state.groups.find(x=>x.id===groupId);
  if(!g) return;
  g.instructorIds = g.instructorIds||[];
  if(checked){ if(!g.instructorIds.includes(instructorId)) g.instructorIds.push(instructorId); }
  else{ g.instructorIds = g.instructorIds.filter(id=>id!==instructorId); }
  await saveGroups();
  render();
}

        <canvas id="sigpad" width="600" height="200"
          onmousedown="sigStart(event)" onmousemove="sigMove(event)" onmouseup="sigEnd(event)" onmouseleave="sigEnd(event)"
          ontouchstart="sigStart(event)" ontouchmove="sigMove(event)" ontouchend="sigEnd(event)"></canvas>
      </div>
      <div class="btn-row">
        <button class="ghost" onclick="sigClear()">Ryd underskrift</button>
        <button class="ghost" onclick="cancelSignModule()">Annuller</button>

function emptySignForm(){ return {startDate:'', endDate:'', extraTheory:'', selfStudy:'', extraPractical:'', manualGear:'', transferred:false, signedByName:''}; }
function startSignModule(moduleId){ state.signingModuleId=moduleId; state.signForm=emptySignForm(); render(); }
function cancelSignModule(){ state.signingModuleId=null; state.signForm=null; render(); }
function updateSignForm(k,v){ state.signForm[k]=v; }
let sigDrawing=false, sigLastPos=null;
function sigGetPos(e){
  const canvas = document.getElementById('sigpad');
  const rect = canvas.getBoundingClientRect();
  const evt = e.touches ? e.touches[0] : e;
  const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
  return { x:(evt.clientX-rect.left)*scaleX, y:(evt.clientY-rect.top)*scaleY };
}
function sigStart(e){ e.preventDefault(); sigDrawing=true; sigLastPos=sigGetPos(e); }
function sigMove(e){
  if(!sigDrawing) return;
  e.preventDefault();
  const canvas = document.getElementById('sigpad');
  const ctx = canvas.getContext('2d');
  const pos = sigGetPos(e);
  ctx.strokeStyle = '#0B2545'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(sigLastPos.x, sigLastPos.y); ctx.lineTo(pos.x, pos.y); ctx.stroke();
  sigLastPos = pos;
}
function sigEnd(){ sigDrawing=false; }
function sigClear(){
  const canvas = document.getElementById('sigpad');
  if(!canvas) return;
  canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
}
function isCanvasBlank(canvas){
  const data = canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;
  for(let i=3;i<data.length;i+=4){ if(data[i]!==0) return false; }
  return true;
}
async function confirmSignature(studentId){
  const canvas = document.getElementById('sigpad');
  if(!canvas){ showToast('Fejl: fandt ikke underskriftsfeltet'); return; }
  const sf = state.signForm;
  if(!sf.signedByName.trim()){ showToast('Skriv kørelærerens navn'); return; }
  if(isCanvasBlank(canvas)){ showToast('Underskriv i feltet med musen eller fingeren først'); return; }
  const dataUrl = canvas.toDataURL('image/png');
  const st = state.students.find(s=>s.id===studentId);
  if(!st) return;
  st.moduleProgress = st.moduleProgress||{};
  st.moduleProgress[state.signingModuleId] = {
    startDate: sf.startDate, endDate: sf.endDate,
    extraTheory: Number(sf.extraTheory)||0, selfStudy: sf.selfStudy||'',
    extraPractical: Number(sf.extraPractical)||0, manualGear: Number(sf.manualGear)||0,
    transferred: !!sf.transferred,
    signedByName: sf.signedByName.trim(), signatureDataUrl: dataUrl,
    signedAt: new Date().toISOString()
  };
  st.completedModules = st.completedModules||[];
  if(!st.completedModules.includes(state.signingModuleId)) st.completedModules.push(state.signingModuleId);
  if(state.currentStudent && state.currentStudent.id===studentId) state.currentStudent = st;
  await saveStudents();
  state.signingModuleId=null; state.signForm=null;
  render();
  showToast('Modul underskrevet');
}
async function undoSignature(studentId, moduleId){
  if(!confirm('Fjern underskriften for dette modul? Eleven vil ikke længere se det som gennemført.')) return;
  const st = state.students.find(s=>s.id===studentId);
  if(!st) return;
  if(st.moduleProgress) delete st.moduleProgress[moduleId];
  if(st.completedModules) st.completedModules = st.completedModules.filter(id=>id!==moduleId);
  if(state.currentStudent && state.currentStudent.id===studentId) state.currentStudent = st;
  await saveStudents();
  render();
  showToast('Underskrift fjernet');
}

async function settleTab(phone){
  const np = normPhone(phone);
  const lines = state.bookings.filter(b=>b.paymentMethod==='lobende' && !b.settled && b.status!=='annulleret' && normPhone(b.phone)===np);
  if(!lines.length){ showToast('Ingen åbne lektioner at afregne'); return; }
  const total = lines.reduce((s,b)=>s+(b.price||0),0);
  const dummy = { price: total };
  await ensureInvoiceNumber(dummy);
  const invNum = dummy.invoiceNumber;
  const now = new Date().toISOString();
  lines.forEach(b=>{ b.settled=true; b.settledInvoiceNumber=invNum; b.settledAt=now; });
  await saveBookings();
  state.lastSettlement = { phone, name:lines[0].name, email:lines[0].email, invoiceNumber:invNum, total, lines:lines.slice(), createdAt:now };
  render();
  showToast('Konto afregnet — faktura klar til udskrift/SMS herunder');
}
function buildSettlementSmsMessage(s){
  let msg = `Hej ${s.name}! Din samlede faktura for ekstra lektioner hos ${state.settings.schoolName} er nu klar: ${s.total.toLocaleString('da-DK')} kr (fakturanr. ${s.invoiceNumber}). `;
  msg += `Betal venligst til: ${state.settings.bankInfo.split('\\n')[0]} — husk fakturanummeret som besked. `;
  msg += `Mvh ${state.settings.schoolName}`;
  return msg;
}
function settlementSmsHref(){
  const s = state.lastSettlement;

  return `sms:+${digits}?body=${encodeURIComponent(buildSettlementSmsMessage(s))}`;
}

async function addInstructor(){
  const name = state.newInstructor.name.trim();
  const pin = state.newInstructor.pin.trim();
  if(!name){ showToast('Skriv et navn'); return; }
  if(!pin){ showToast('Sæt en PIN til kørelæreren'); return; }
  state.settings.instructors = state.settings.instructors||[];
  state.settings.instructors.push({ id:newId(), name, pinHash: await hashText(pin) });
  await saveSettings();
  state.newInstructor = emptyNewInstructor();
  state.newVehicle = emptyNewVehicle();
  render();
  showToast('Kørelærer tilføjet');
}
async function deleteInstructor(id){

  state.settings.instructors = (state.settings.instructors||[]).filter(i=>i.id!==id);

}

function generateRandomPin(length){
  let pin='';
  for(let i=0;i<length;i++) pin += Math.floor(Math.random()*10);
  return pin;
}
async function regenerateAllPins(){
  if(!confirm('Dette nulstiller din Admin-PIN og ALLE kørelæreres PIN-koder med det samme — de gamle koder holder op med at virke. Er du sikker?')) return;
  const results = [];
  const newAdminPin = generateRandomPin(4);
  state.settings.adminPinHash = await hashText(newAdminPin);
  results.push({ name: state.settings.schoolName+' (Køreskole/Admin)', pin:newAdminPin });
  for(const inst of (state.settings.instructors||[])){
    const p = generateRandomPin(4);
    inst.pinHash = await hashText(p);
    results.push({ name: inst.name, pin:p });
  }
  await saveSettings();
  state.newPinResults = results;
  render();
  showToast('Nye PIN-koder genereret — skriv dem ned nu');
}
async function setDurationLive(val){ state.settings.lessonDurationMinutes = Number(val)||90; await saveSettings(); showToast('Lektionslængde opdateret'); }
async function setShortDurationLive(val){ state.settings.shortLessonDurationMinutes = Number(val)||45; await saveSettings(); showToast('Kort lektionslængde opdateret'); }

function nr(key,val){ state.newRule[key]=val; }
function nrWeek(day,key,val){ state.newRule.week[day][key]=val; }
function applySchedulePreset(preset){
  const w = state.newRule.week;
  const weekdays = [1,2,3,4,5];
  const allDays = [1,2,3,4,5,6,0];
  if(preset==='weekdays-8-16'){ weekdays.forEach(d=>{ w[d].start='08:00'; w[d].end='16:00'; }); }
  if(preset==='weekdays-9-17'){ weekdays.forEach(d=>{ w[d].start='09:00'; w[d].end='17:00'; }); }
  if(preset==='alldays-8-20'){ allDays.forEach(d=>{ w[d].start='08:00'; w[d].end='20:00'; }); }
  render();
}
function copyMondayToWeekdays(){
  const w = state.newRule.week;
  const src = w[1];
  if(!src.start || !src.end){ showToast('Udfyld først mandag'); return; }
  [2,3,4,5].forEach(d=>{ w[d].start=src.start; w[d].end=src.end; });
  render();
  showToast('Kopieret til alle hverdage');
}
async function addScheduleRule(){
  const r = state.newRule;
  if(!r.startDate || !r.endDate){ showToast('Vælg start- og slutdato'); return; }
  if(r.endDate < r.startDate){ showToast('Slutdato skal være efter startdato'); return; }
  const week={};
  let hasAny=false;
  Object.keys(r.week).forEach(k=>{
    const w = r.week[k];
    if(w.start && w.end){ week[k]={start:w.start,end:w.end}; hasAny=true; } else { week[k]=null; }
  });
  if(!hasAny){ showToast('Angiv arbejdstid for mindst én ugedag'); return; }
  state.settings.scheduleRules = state.settings.scheduleRules||[];
  const ownId = state.adminRole==='owner' ? (r.instructorId||'') : (state.currentInstructor ? state.currentInstructor.id : '');
  state.settings.scheduleRules.push({ id:newId(), startDate:r.startDate, endDate:r.endDate, repeatWeeks:Number(r.repeatWeeks)||1, breakStart:r.breakStart, breakEnd:r.breakEnd, instructorId:ownId, week });
  await saveSettings();
  state.newRule = emptyNewRule();
  render();
  showToast('Skema tilføjet');
}

  if(!confirm('Slet dette skema?')) return;
  state.settings.scheduleRules = (state.settings.scheduleRules||[]).filter(r=>r.id!==id);
  await saveSettings(); render(); showToast('Skema slettet');
}

      <input value="${d.cvr}" oninput="d('cvr',this.value)" placeholder="12345678">
      <label>Adresse</label>
      <input value="${d.address}" oninput="d('address',this.value)" placeholder="Gadenavn 1, 3520 Farum">
      <label>Telefon</label>
      <input value="${d.phone}" oninput="d('phone',this.value)" placeholder="22228385">
      <label>Email</label>
      <input value="${d.email}" oninput="d('email',this.value)" placeholder="info@plusdrive.dk">
      <label>Næste fakturanummer</label>
      <input type="number" value="${d.invoiceCounter}" oninput="d('invoiceCounter',this.value)">
      <label>Betalingsfrist (dage fra fakturadato)</label>
      <input type="number" value="${d.paymentDueDays}" oninput="d('paymentDueDays',this.value)">
      <div class="check-row">
        <input type="checkbox" id="vatToggle" ${d.showVat?'checked':''} onchange="d('showVat',this.checked)">
        <label for="vatToggle">Vis momsspecifikation på fakturaer</label>
      </div>
      <label>Momssats (%)</label>
      <input type="number" value="${d.vatRate}" oninput="d('vatRate',this.value)">
      <div class="small-note">Priser i systemet regnes som inkl. moms — momsbeløbet regnes automatisk ud fra denne sats og vises som en linje på fakturaen.</div>

      <h4>Betaling</h4>
      <label>Gebyr ved betalingslink (%)</label>
      <input type="number" step="0.1" value="${d.gatewayFeePercent}" oninput="d('gatewayFeePercent',this.value)">
      <label>Betalingslink (URL til din betalingsgateway)</label>
      <input value="${d.paymentLink}" oninput="d('paymentLink',this.value)" placeholder="https://...">
      <label>Note til eleven om betalingslink</label>
      <textarea rows="2" oninput="d('paymentNote',this.value)">${d.paymentNote}</textarea>

      <h4>Gearvalg</h4>
      <div class="small-note" style="margin-top:0;">Vist til eleven, når de opretter en konto. Beskrivelserne er tomme som standard — udfyld dem, når I er klar.</div>
      ${Object.keys(d.gearOptions).map(key=>`
        <label>Navn</label>
        <input value="${d.gearOptions[key].name}" oninput="dGear('${key}','name',this.value)">
        <label>Beskrivelse (valgfri)</label>
        <textarea rows="2" oninput="dGear('${key}','description',this.value)">${d.gearOptions[key].description}</textarea>
      `).join('')}

      <h4>Pakker</h4>
      ${['basic','super','lynpakke'].map(key=>{
        const pk = d.packages[key];
        return `
        <div class="rule-card">
          <label>Navn</label>
          <input value="${pk.name}" oninput="dPkg('${key}','name',this.value)">
          <label>Pris (kr)</label>
          <input type="number" value="${pk.price}" oninput="dPkg('${key}','price',this.value)">
          <label>Varighed (badge, fx "8 til 12 uger")</label>
          <input value="${pk.duration}" oninput="dPkg('${key}','duration',this.value)">
          <label>Ikon (emoji)</label>
          <input value="${pk.icon}" oninput="dPkg('${key}','icon',this.value)" style="max-width:80px;">
          <label>Antal lektioner på vej (bruges til elevens forløbsplan)</label>
          <input type="number" value="${pk.roadLessons||0}" oninput="dPkg('${key}','roadLessons',this.value)">
          <label>Tagline</label>
          <input value="${pk.tagline}" oninput="dPkg('${key}','tagline',this.value)">
          <label>Features (én pr. linje)</label>
          <textarea rows="6" oninput="dPkgFeatures('${key}',this.value)">${(pk.features||[]).join('\\n')}</textarea>
        </div>`;
      }).join('')}

      <h4>Ekstra lektion</h4>
      <label>Pris pr. ekstra lektion, ${d.lessonDurationMinutes} min (kr)</label>
      <input type="number" value="${d.extraLessonPrice}" oninput="d('extraLessonPrice',this.value)">
      ${d.allowShortLessons ? `
      <label>Pris pr. kort lektion, ${d.shortLessonDurationMinutes} min (kr)</label>
      <input type="number" value="${d.extraLessonPriceShort}" oninput="d('extraLessonPriceShort',this.value)">
      ` : ''}
      <label>Beskrivelse</label>
      <textarea rows="2" oninput="d('extraDesc',this.value)">${d.extraDesc}</textarea>

      <h4>Køreprøver</h4>
      <label>Pris – Teoriprøve (kr) — sæt til 0 for gratis</label>
      <input type="number" value="${d.examPrices.teori}" oninput="dNested('examPrices','teori',this.value)">
      <label>Beskrivelse – Teoriprøve</label>
      <textarea rows="2" oninput="dNested('examDesc','teori',this.value)">${d.examDesc.teori}</textarea>
      <label>Pris – Praktisk prøve (kr)</label>
      <input type="number" value="${d.examPrices.praktisk}" oninput="dNested('examPrices','praktisk',this.value)">
      <label>Beskrivelse – Praktisk prøve</label>
      <textarea rows="2" oninput="dNested('examDesc','praktisk',this.value)">${d.examDesc.praktisk}</textarea>

      <div class="btn-row"><button class="primary" onclick="saveAdminSettings()">Gem indstillinger</button></div>
      <div class="small-note">Arbejdstider, pauser og blokeringer styres under fanen "Kalender".</div>
    </div>

    <div class="settings-box">
      <h4>Ofte stillede spørgsmål</h4>
      <div class="small-note" style="margin-top:0;">Vist til eleven under "Hjælp". Find dem ikke svar her, kan de skrive direkte til jer.</div>
      ${(state.settings.faqs||[]).map(f=>`
        <div class="rule-card">
          <div class="rule-top">
            <div>${f.question}</div>
            <button onclick="deleteFaq('${f.id}')">Slet</button>
          </div>
          <div class="small-note" style="margin-top:6px;">${f.answer}</div>
        </div>
      `).join('') || `<p class="small-note">Ingen spørgsmål oprettet endnu.</p>`}
      <label>Spørgsmål</label>
      <input value="${(state.newFaq||{question:''}).question}" oninput="nfaqSet('question',this.value)" placeholder="fx Hvordan aflyser jeg en tid?">
      <label>Svar</label>
      <textarea rows="2" oninput="nfaqSet('answer',this.value)">${(state.newFaq||{answer:''}).answer}</textarea>
      <div class="btn-row"><button class="primary" onclick="addFaq()">Tilføj spørgsmål</button></div>
    </div>

    <div class="settings-box">
      <h4>Forløb (moduler)</h4>
      <div class="small-note" style="margin-top:0;">Disse moduler bruges til at vise elevernes fremskridt under fanen "Elever". Tilpas dem til jeres rigtige undervisningsplan.</div>
      ${(state.settings.modules||[]).map((m,i)=>`
        <div class="rule-card">
          <div class="rule-top">
            <div>${i+1}. ${m.name}</div>
            <button onclick="deleteModule('${m.id}')">Slet</button>
          </div>
          ${m.description ? `<div class="small-note" style="margin-top:4px;">${m.description}</div>` : ''}
        </div>
      `).join('')}
      <label>Tilføj modul</label>
      <input value="${state.newModule.name}" oninput="nmSet('name',this.value)" placeholder="fx Modul 6 — Mørkekørsel">
      <label>Beskrivelse/krav (valgfri)</label>
      <input value="${state.newModule.description}" oninput="nmSet('description',this.value)" placeholder="fx Minimum 2 teoretiske lektioner.">
      <div class="btn-row"><button class="primary" onclick="addModule()">Tilføj modul</button></div>
    </div>
  `;
}
function d(key,val){ state.adminSettingsDraft[key]=val; }
function dNested(obj,key,val){ state.adminSettingsDraft[obj][key]=val; }
function dGear(key,field,val){ state.adminSettingsDraft.gearOptions[key][field]=val; }
function nfaqSet(key,val){ state.newFaq = state.newFaq||{question:'',answer:''}; state.newFaq[key]=val; }
async function addFaq(){
  const f = state.newFaq||{};
  if(!f.question || !f.question.trim()){ showToast('Skriv et spørgsmål'); return; }
  state.settings.faqs = state.settings.faqs||[];
  state.settings.faqs.push({ id:newId(), question:f.question.trim(), answer:(f.answer||'').trim() });
  await saveSettings();
  state.newFaq = {question:'',answer:''};
  render();
  showToast('Spørgsmål tilføjet');
}
async function deleteFaq(id){
  if(!confirm('Slet dette spørgsmål?')) return;
  state.settings.faqs = (state.settings.faqs||[]).filter(f=>f.id!==id);
  await saveSettings(); render(); showToast('Spørgsmål slettet');
}
function dPkg(pkgKey,field,val){ state.adminSettingsDraft.packages[pkgKey][field]=val; }
function dPkgFeatures(pkgKey,val){ state.adminSettingsDraft.packages[pkgKey].features = val.split('\n').map(s=>s.trim()).filter(Boolean); }
function nmSet(key,val){ state.newModule[key]=val; }
async function addModule(){
  const name = state.newModule.name.trim();
  if(!name){ showToast('Skriv et modulnavn'); return; }
  state.settings.modules = state.settings.modules||[];
  state.settings.modules.push({ id:newId(), name, description:(state.newModule.description||'').trim() });
  await saveSettings();
  state.newModule = emptyNewModule();
  render();
  showToast('Modul tilføjet');
}
async function deleteModule(id){
  if(!confirm('Slet dette modul? Det fjernes også fra elevernes forløb.')) return;
  state.settings.modules = (state.settings.modules||[]).filter(m=>m.id!==id);
  state.students.forEach(s=>{ if(s.completedModules) s.completedModules = s.completedModules.filter(mid=>mid!==id); });
  await saveSettings();
  await saveStudents();
  render();
  showToast('Modul slettet');
}
async function saveAdminSettings(){
  ['basic','super','lynpakke'].forEach(key=>{
    state.adminSettingsDraft.packages[key].price = Number(state.adminSettingsDraft.packages[key].price)||0;
  });
  state.adminSettingsDraft.extraLessonPrice = Number(state.adminSettingsDraft.extraLessonPrice)||0;
  state.adminSettingsDraft.gatewayFeePercent = Number(state.adminSettingsDraft.gatewayFeePercent)||0;
  state.adminSettingsDraft.examPrices.teori = Number(state.adminSettingsDraft.examPrices.teori)||0;
  state.adminSettingsDraft.examPrices.praktisk = Number(state.adminSettingsDraft.examPrices.praktisk)||0;
  state.adminSettingsDraft.invoiceCounter = Number(state.adminSettingsDraft.invoiceCounter)||1000;
  state.adminSettingsDraft.paymentDueDays = Number(state.adminSettingsDraft.paymentDueDays)||9;
  state.adminSettingsDraft.vatRate = Number(state.adminSettingsDraft.vatRate)||25;
  state.adminSettingsDraft.scheduleRules = state.settings.scheduleRules;
  state.adminSettingsDraft.blockedRanges = state.settings.blockedRanges;
  state.adminSettingsDraft.forceOpenSlots = state.settings.forceOpenSlots;
  state.adminSettingsDraft.instructors = state.settings.instructors;
  state.adminSettingsDraft.modules = state.settings.modules;
  state.adminSettingsDraft.vehicles = state.settings.vehicles;
  state.adminSettingsDraft.budget = state.settings.budget;
  state.adminSettingsDraft.faqs = state.settings.faqs;
  state.adminSettingsDraft.lessonDurationMinutes = state.settings.lessonDurationMinutes;
  state.adminSettingsDraft.smartSchedulingEnabled = state.settings.smartSchedulingEnabled;
  if(state.adminSettingsDraft.newAdminPin && state.adminSettingsDraft.newAdminPin.trim()){
    state.adminSettingsDraft.adminPinHash = await hashText(state.adminSettingsDraft.newAdminPin.trim());
  } else {
    state.adminSettingsDraft.adminPinHash = state.settings.adminPinHash;
  }
  delete state.adminSettingsDraft.newAdminPin;
  state.settings = state.adminSettingsDraft;
  await saveSettings();
  render();
  showToast('Indstillinger gemt');
}

loadData();
</script>
</body>
</html>
